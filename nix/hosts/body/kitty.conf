# --- CURSOR ---
# Set to 'beam' for the I-beam style
cursor_shape beam
# Optional: Make the beam blink
cursor_blink_interval 0.5

# --- OPACITY & BLUR ---
# 0.0 is fully transparent, 1.0 is fully opaque
background_opacity 0.85

# Ask the compositor to blur the background behind the window
# (See the important caveat about GNOME below!)
background_blur 10

# --- BACKGROUND IMAGE ---
# Provide the absolute path to your desired background image
background_image /home/mark/Pictures/your-background.png

# 'cscaled' scales the image to cover the terminal, cropping if necessary
background_image_layout cscaled

# 'tint' darkens the image so your text remains readable. 
# 0.0 is the original image, 1.0 is a solid black background.
background_tint 0.95
