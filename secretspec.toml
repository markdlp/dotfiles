#:schema https://secretspec.dev/schema/secretspec.schema.json
[project]
name = "dotfiles"
revision = "1.0"
require_reason = false

[providers.bw]
uri = "bw://"

[profiles.default]
# SSH private keys managed via Bitwarden (Item: "SSH Keys")
SSH_KEY_WAIST = { description = "SSH private key for waist.local", type = "ssh_private_key", as_path = true, providers = ["bw"], ref = { item = "SSH Keys", field = "id_myWaist" } }
SSH_KEY_SKULL = { description = "SSH private key for mySkull.local", type = "ssh_private_key", as_path = true, providers = ["bw"], ref = { item = "SSH Keys", field = "id_mySkull" } }
SSH_KEY_GITHUB = { description = "SSH private key for GitHub", type = "ssh_private_key", as_path = true, providers = ["bw"], ref = { item = "SSH Keys", field = "id_gh_win" } }
SSH_KEY_ASPIRE = { description = "SSH private key for aspire", type = "ssh_private_key", as_path = true, providers = ["bw"], ref = { item = "SSH Keys", field = "id_aspire" } }
SSH_KEY_HAIR = { description = "SSH private key for myHair", type = "ssh_private_key", as_path = true, providers = ["bw"], ref = { item = "SSH Keys", field = "id_myHair" } }
SSH_KEY_ZAFORA = { description = "SSH private key for zafora", type = "ssh_private_key", as_path = true, providers = ["bw"], ref = { item = "SSH Keys", field = "id_zafora" } }
