#:schema https://secretspec.dev/schema/secretspec.schema.json
[project]
name = "dotfiles"
revision = "1.0"
require_reason = false

[providers.bw]
uri = "bw://"

[profiles.default]
# SSH private keys managed via Bitwarden (Item: "SSH Keys")
# Marked required = false so missing keys do not fail commands targeting other hosts
SSH_KEY_WAIST = { description = "SSH private key for waist.local", type = "ssh_private_key", as_path = true, providers = ["bw"], ref = { item = "SSH Keys", field = "id_myWaist" }, required = false }
SSH_KEY_SKULL = { description = "SSH private key for mySkull.local", type = "ssh_private_key", as_path = true, providers = ["bw"], ref = { item = "SSH Keys", field = "id_mySkull" }, required = false }
SSH_KEY_GITHUB = { description = "SSH private key for GitHub", type = "ssh_private_key", as_path = true, providers = ["bw"], ref = { item = "SSH Keys", field = "id_gh_win" }, required = false }
SSH_KEY_ASPIRE = { description = "SSH private key for aspire", type = "ssh_private_key", as_path = true, providers = ["bw"], ref = { item = "SSH Keys", field = "id_aspire" }, required = false }
SSH_KEY_HAIR = { description = "SSH private key for myHair", type = "ssh_private_key", as_path = true, providers = ["bw"], ref = { item = "SSH Keys", field = "id_myHair" }, required = false }
SSH_KEY_ZAFORA = { description = "SSH private key for zafora", type = "ssh_private_key", as_path = true, providers = ["bw"], ref = { item = "SSH Keys", field = "id_zafora" }, required = false }

# Scopes allow resolving ONLY the secrets needed for a specific target host or command
[scopes.waist]
secrets = ["SSH_KEY_WAIST"]

[scopes.skull]
secrets = ["SSH_KEY_SKULL"]

[scopes.github]
secrets = ["SSH_KEY_GITHUB"]

[scopes.all_ssh]
secrets = [
  "SSH_KEY_WAIST",
  "SSH_KEY_SKULL",
  "SSH_KEY_GITHUB",
  "SSH_KEY_ASPIRE",
  "SSH_KEY_HAIR",
  "SSH_KEY_ZAFORA",
]
